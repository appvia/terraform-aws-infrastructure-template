---
name: Terraform Destroy
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Expects the name of the repository to be confirmed
        required: true
        type: string

      aws-account-id:
        description: "The AWS account ID to deploy to"
        required: true
        type: string

      aws-role:
        description: "The AWS role to assume"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  destroy:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-destroy.yml@2a4cf9fe2d9d3ea45b1ad9ed4b5b59d0b50892e1 # main
    name: Terraform Destroy
    secrets:
      actions-id: "${{ secrets.ORG_ACTIONS_APP_ID }}"
      actions-secret: "${{ secrets.ORG_ACTIONS_APP_SECRET }}"
    with:
      aws-account-id: ${{ inputs.aws-account-id }}
      aws-role: ${{ inputs.aws-role }}
      enable-private-access: true
      terraform-values-file: values/dev.tfvars
      terraform-dir: terraform
