---
name: Infrastructure Pipeline
on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

